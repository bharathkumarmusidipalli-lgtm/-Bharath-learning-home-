<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MessFlow – Mess Check-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf1ee;--ink:#10282a;--mut:#4d6663;--card:#fff;--line:#cddbd6;--saf:#f2a93b;--chili:#c93d2c;--leaf:#1f8a5b;--pri:#10403f;--on:#fff;--sh:0 10px 30px -12px rgba(16,40,42,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0b1a1b;--ink:#e6f1ee;--mut:#9fb8b3;--card:#132a2b;--line:#244141;--pri:#f2a93b;--on:#10282a;--leaf:#4fd196;--chili:#ff7a69}}
:root[data-theme=dark]{--bg:#0b1a1b;--ink:#e6f1ee;--mut:#9fb8b3;--card:#132a2b;--line:#244141;--pri:#f2a93b;--on:#10282a;--leaf:#4fd196;--chili:#ff7a69}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:"Bricolage Grotesque","DM Sans",sans-serif;line-height:1.1;margin:0 0 .5rem;letter-spacing:-.02em}
h1{font-size:clamp(2rem,7vw,3.2rem);font-weight:800}h2{font-size:1.5rem}h3{font-size:1.1rem}
p{margin:.25rem 0 1rem}.mut{color:var(--mut)}
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
.bg i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.35;animation:fl 18s ease-in-out infinite alternate}
.bg i:nth-child(1){width:340px;height:340px;background:var(--saf);top:-80px;left:-60px}
.bg i:nth-child(2){width:420px;height:420px;background:#3aa985;bottom:-140px;right:-100px;animation-duration:24s}
.bg i:nth-child(3){width:240px;height:240px;background:#7fc4d6;top:45%;left:55%;animation-duration:21s}
@keyframes fl{to{transform:translate(60px,40px) scale(1.15)}}
header.top{display:flex;align-items:center;gap:.75rem;flex-wrap:wrap;padding:.9rem 1.1rem;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px);background:color-mix(in srgb,var(--bg) 78%,transparent);border-bottom:1px solid var(--line)}
.brand{font:800 1.3rem "Bricolage Grotesque",sans-serif;color:var(--ink);text-decoration:none;margin-right:auto;display:flex;gap:.45rem;align-items:center}
.brand b{width:26px;height:26px;border-radius:8px;background:var(--saf);display:grid;place-items:center;font-size:.9rem;color:#10282a}
nav{display:flex;gap:.25rem;flex-wrap:wrap}
nav a,nav button{padding:.5rem .8rem;border-radius:999px;color:var(--ink);text-decoration:none;font:500 .92rem inherit;font-family:inherit;background:none;border:0;cursor:pointer;min-height:44px;display:inline-flex;align-items:center}
nav a:hover,nav button:hover{background:var(--line)}nav a[aria-current=page]{background:var(--pri);color:var(--on)}
main{max-width:980px;margin:0 auto;padding:1.4rem 1.1rem 4rem}
.page{animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:1.3rem;box-shadow:var(--sh);transition:transform .25s,box-shadow .25s}
.card.h:hover{transform:translateY(-4px)}
.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.stk>*+*{margin-top:1rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:48px;padding:.7rem 1.3rem;border-radius:14px;border:0;background:var(--pri);color:var(--on);font:700 1rem "DM Sans",sans-serif;cursor:pointer;text-decoration:none;transition:transform .12s,filter .2s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.96)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.go{background:var(--leaf);color:#fff;font-size:1.2rem;min-height:64px;width:100%;border-radius:18px}
.btn.out{background:var(--chili);color:#fff;font-size:1.2rem;min-height:64px;width:100%;border-radius:18px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{min-height:40px;padding:.4rem .9rem;font-size:.9rem;border-radius:10px}
:focus-visible{outline:3px solid var(--saf);outline-offset:2px}
label{display:block;font-weight:700;font-size:.9rem;margin:.8rem 0 .3rem}
input,select,textarea{width:100%;min-height:48px;padding:.65rem .85rem;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px}
.err{color:var(--chili);font-weight:700;margin:.6rem 0 0;min-height:1.4em}
.err:not(:empty):before{content:"⚠ "}
.big{font:800 clamp(3.4rem,16vw,6rem)/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em}
.bar{height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:var(--leaf);transition:width 1s cubic-bezier(.2,.8,.2,1),background .4s}
.bar i.busy{background:var(--saf)}.bar i.full{background:var(--chili)}
.pill{display:inline-flex;gap:.4rem;align-items:center;padding:.25rem .8rem;border-radius:99px;font-weight:700;font-size:.85rem;border:1.5px solid currentColor}
.pill.quiet{color:var(--leaf)}.pill.busy{color:#b57400}.pill.full{color:var(--chili)}
@media(prefers-color-scheme:dark){.pill.busy{color:var(--saf)}}
.portal{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:1.5rem}
.portal a{text-decoration:none;color:inherit}.portal .ic{font-size:2.2rem;display:block;margin-bottom:.6rem;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.qr{width:200px;height:200px;margin:0 auto;border-radius:16px;background:#fff;display:grid;place-items:center;border:2px dashed var(--line);padding:8px;text-align:center;font-size:.8rem;color:#4d6663}
.qr img{width:100%;height:100%;object-fit:contain}
table{width:100%;border-collapse:collapse;font-size:.92rem}th,td{padding:.6rem .5rem;text-align:left;border-bottom:1px solid var(--line)}
.sc{overflow-x:auto}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap;justify-content:space-between}
.chip{display:inline-flex;gap:.4rem;align-items:center;background:var(--bg);border:1px solid var(--line);padding:.3rem .5rem .3rem .8rem;border-radius:99px;margin:.2rem;animation:pop .3s}
.chip button{border:0;background:var(--line);color:var(--ink);border-radius:50%;width:26px;height:26px;cursor:pointer}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.dev{background:var(--saf);color:#10282a;font-size:.82rem;font-weight:700;text-align:center;padding:.35rem}
.sk{height:120px;border-radius:22px;background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;margin-bottom:1rem}
@keyframes sh{to{background-position:-200% 0}}
.empty{text-align:center;padding:2rem 1rem;color:var(--mut)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:.8rem 1.2rem;border-radius:14px;opacity:0;transition:.35s;z-index:20;max-width:90vw;font-weight:700}
#toast.on{opacity:1;transform:translate(-50%,0)}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:rgba(16,40,42,.7);z-index:15;animation:in .3s;text-align:center;color:#fff}
.ov svg{width:120px;height:120px}.ov circle,.ov path{fill:none;stroke:#fff;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:300;stroke-dashoffset:300;animation:dr .7s .1s forwards}
.ov path{animation-delay:.5s}@keyframes dr{to{stroke-dashoffset:0}}
dialog{border:0;border-radius:22px;padding:1.5rem;max-width:min(92vw,420px);background:var(--card);color:var(--ink);box-shadow:var(--sh)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.steps{display:flex;gap:.5rem;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="dev">Development preview data — production data will come from Supabase</div>
<header class="top"><a class="brand" href="#/"><b>M</b>MessFlow</a><nav id="nav" aria-label="Main"></nav></header>
<main id="app" tabindex="-1" aria-live="polite"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg" aria-labelledby="dt"><h3 id="dt">Reset mess?</h3><p>This checks out everyone currently inside and sets occupancy to 0. It cannot be undone.</p><div class="row"><button class="btn ghost" id="dno">Cancel</button><button class="btn out" style="width:auto;min-height:48px;font-size:1rem" id="dyes">Reset occupancy</button></div></dialog>

<script>
/* ========= CONFIG (Vercel: set in Project → Environment Variables) =========
   VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY. Never put a service-role key here.
   In a Vite build use import.meta.env.VITE_*; this single-file preview leaves them empty. */
const ENV={url:"",key:"",qr:""}; // qr: path/URL of the official Common Mess QR image
/* ========= DATA LAYER: replace each api.* body with a Supabase query ========= */
const DB={cap:120,name:"Main Mess",
 users:[{email:"student@mess.dev",pass:"student123",name:"Asha Rao",roll:"21CS042"}],
 admin:{email:"admin@mess.dev",pass:"admin123"},
 inside:[{email:"p1",name:"Preview student 1"},{email:"p2",name:"Preview student 2"},{email:"p3",name:"Preview student 3"}],
 tx:[],problems:[{id:1,who:"Preview student",text:"Water cooler empty at Dinner",at:Date.now()-36e5,done:false}],
 menu:{Breakfast:["Idli","Sambar","Tea"],Lunch:["Rice","Dal","Mixed veg","Curd"],Dinner:["Chapati","Paneer curry","Salad"]},
 codes:{}};
const wait=(ms=450)=>new Promise(r=>setTimeout(r,ms));
const fail=m=>{throw new Error(m)};
const api={
 async login(role,email,pass){await wait();const u=role==="admin"?(DB.admin.email===email&&DB.admin.pass===pass&&{email,name:"Admin"}):DB.users.find(x=>x.email===email&&x.pass===pass);if(!u)fail("Invalid email or password.");return{role,email:u.email,name:u.name}},
 async register(d){await wait();if(DB.users.some(u=>u.email===d.email))fail("This email is already registered.");DB.codes[d.email]={code:"123456",d};return true},
 async verify(email,code){await wait();const c=DB.codes[email];if(!c||c.code!==code)fail("Invalid verification code.");DB.users.push(c.d);delete DB.codes[email];return{role:"student",email,name:c.d.name}},
 async occ(){await wait(250);return{n:DB.inside.length,cap:DB.cap,name:DB.name}},
 async inside(email){return DB.inside.some(i=>i.email===email)},
 async enter(s){await wait();if(DB.inside.some(i=>i.email===s.email))fail("You're already inside the mess.");if(DB.inside.length>=DB.cap)fail("The mess is full right now.");DB.inside.push({email:s.email,name:s.name});DB.tx.unshift({who:s.name,type:"IN",at:Date.now()})},
 async exit(s){await wait();const i=DB.inside.findIndex(x=>x.email===s.email);if(i<0)fail("You're currently outside the mess.");DB.inside.splice(i,1);DB.tx.unshift({who:s.name,type:"OUT",at:Date.now()})},
 async report(s,text){await wait();if(!text.trim())fail("Describe the problem first.");DB.problems.unshift({id:Date.now(),who:s.name,text:text.trim(),at:Date.now(),done:false})},
 async tx(){await wait(300);return DB.tx},
 async problems(){await wait(300);return DB.problems},
 async resolve(id){await wait(200);const p=DB.problems.find(p=>p.id===id);p.done=!p.done},
 async menu(){await wait(250);return DB.menu},
 async menuEdit(meal,item,add){await wait(200);const l=DB.menu[meal];if(add){if(!item.trim())fail("Enter a dish name.");l.push(item.trim())}else l.splice(l.indexOf(item),1)},
 async setCap(n,name){await wait();if(!(n>0))fail("Capacity must be above 0.");DB.cap=n;DB.name=name||DB.name},
 async reset(){await wait(600);const n=DB.inside.length;DB.inside=[];DB.tx.unshift({who:"Admin reset ("+n+" cleared)",type:"RESET",at:Date.now()})}
};
/* ========= HELPERS ========= */
const $=s=>document.querySelector(s),app=$("#app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>new Date(t).toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
let S=null;try{S=JSON.parse(localStorage.getItem("mf_s")||"null")}catch(e){}
const save=s=>{S=s;try{s?localStorage.setItem("mf_s",JSON.stringify(s)):localStorage.removeItem("mf_s")}catch(e){}};
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),3200)};
const go=h=>{location.hash=h};
const sk='<div class="sk"></div><div class="sk"></div>';
const status=(n,c)=>{const p=n/c;return p>=1?["full","Full"]:p>=.75?["busy","Busy"]:["quiet","Quiet"]};
function occCard(o){const[k,l]=status(o.n,o.cap),pct=Math.min(100,Math.round(o.n/o.cap*100));
 return`<div class="card"><div class="row"><h3>${esc(o.name)} occupancy</h3><span class="pill ${k}">${k==="full"?"■":k==="busy"?"▲":"●"} ${l}</span></div>
 <div class="big"><span class="num" data-to="${o.n}">${o.n}</span><span class="mut" style="font-size:.3em"> / ${o.cap} inside</span></div>
 <div class="bar" role="progressbar" aria-valuenow="${o.n}" aria-valuemin="0" aria-valuemax="${o.cap}" aria-label="Occupancy"><i class="${k}" data-w="${pct}"></i></div>
 <p class="mut" style="margin-top:.6rem">${pct}% of capacity · ${Math.max(0,o.cap-o.n)} seats free</p></div>`}
let lastN=0;
function animate(){document.querySelectorAll(".bar i").forEach(b=>requestAnimationFrame(()=>requestAnimationFrame(()=>b.style.width=b.dataset.w+"%")));
 document.querySelectorAll(".num").forEach(el=>{const to=+el.dataset.to,from=lastN,t0=performance.now();lastN=to;const f=t=>{const p=Math.min(1,(t-t0)/700);el.textContent=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)};requestAnimationFrame(f)})}
function qrBox(){return`<div class="qr">${ENV.qr?`<img src="${esc(ENV.qr)}" alt="Common Mess QR code">`:"Common Mess QR<br>(set ENV.qr to the official image)"}</div>`}
function success(msg){const d=document.createElement("div");d.className="ov";d.setAttribute("role","alert");d.innerHTML=`<div><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="48"/><path d="M38 62l16 16 30-34"/></svg><h2 style="margin-top:1rem">${msg}</h2></div>`;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
async function act(btn,fn,okMsg,errEl){const t=btn.textContent;btn.disabled=true;btn.textContent="Please wait…";try{await fn();if(okMsg)success(okMsg);return true}catch(e){const m=e.message&&e.message.length<80?e.message:"Connection problem. Please try again.";if(errEl)errEl.textContent=m;toast(m);return false}finally{btn.disabled=false;btn.textContent=t}}
/* ========= NAV ========= */
function nav(path){const n=$("#nav");const L=(h,t)=>`<a href="#${h}" ${path===h?'aria-current="page"':""}>${t}</a>`;
 n.innerHTML=!S?L("/","Portals"):S.role==="admin"?L("/admin","Live")+L("/admin/tx","Transactions")+L("/admin/problems","Problems")+L("/admin/menu","Menu")+L("/admin/settings","Settings")+'<button data-out>Sign out</button>':L("/student","Home")+L("/checkin","Check-in")+L("/menu","Menu")+L("/report","Report")+'<button data-out>Sign out</button>';
 n.querySelector("[data-out]")?.addEventListener("click",()=>{save(null);toast("Signed out.");go("/")})}
/* ========= VIEWS ========= */
const V={};
V["/"]=async()=>{if(S)return go(S.role==="admin"?"/admin":"/student");
 return`<div class="page"><h1>Know before you queue.</h1><p class="mut" style="max-width:34ch">Check in with one scan, see how full the mess is, and skip the rush.</p>
 <div class="portal"><a href="#/student/login" class="card h"><span class="ic">🍽️</span><h2>Student portal</h2><p class="mut">Check in, view today's menu, report problems.</p><span class="btn">Open student portal</span></a>
 <a href="#/admin/login" class="card h"><span class="ic">🛠️</span><h2>Admin portal</h2><p class="mut">Monitor occupancy, manage menu and settings.</p><span class="btn ghost">Open admin portal</span></a></div></div>`};
function authForm(role,reg){return`<div class="page"><div class="card" style="max-width:440px;margin:1rem auto"><h2>${role==="admin"?"Admin login":reg?"Create student account":"Student login"}</h2>
 <form id="f" novalidate>${reg?'<label for="nm">Full name</label><input id="nm" autocomplete="name" required><label for="rl">Roll number</label><input id="rl" required>':""}
 <label for="em">Email</label><input id="em" type="email" autocomplete="email" required><label for="pw">Password</label><input id="pw" type="password" autocomplete="${reg?"new":"current"}-password" required minlength="6">
 <div id="ve" class="err" role="alert"></div><button class="btn" style="width:100%;margin-top:.6rem">${reg?"Send verification code":"Log in"}</button></form>
 ${role==="student"?`<p style="margin-top:1rem">${reg?'Have an account? <a href="#/student/login">Log in</a>':'New here? <a href="#/student/register">Register</a>'}</p>`:""}
 ${!reg?`<p class="mut" style="font-size:.85rem">Preview login: ${role==="admin"?"admin@mess.dev / admin123":"student@mess.dev / student123"}</p>`:'<p class="mut" style="font-size:.85rem">Preview verification code: 123456</p>'}</div></div>`}
V["/student/login"]=async()=>S?go("/student"):authForm("student");
V["/student/register"]=async()=>S?go("/student"):authForm("student",true);
V["/admin/login"]=async()=>S?go(S.role==="admin"?"/admin":"/student"):authForm("admin");
V["/student"]=async()=>{const[o,ins]=await Promise.all([api.occ(),api.inside(S.email)]);
 return`<div class="page stk"><h1>Hi, ${esc(S.name.split(" ")[0])}</h1>${occCard(o)}
 <div class="grid"><div class="card"><h3>You are ${ins?"inside":"outside"} the mess</h3><p class="mut">${ins?"Remember to exit when you finish.":"Scan the QR on the mess board to check in."}</p><a class="btn ${ins?"out":"go"}" href="#/checkin">${ins?"Exit mess":"Enter mess"}</a></div>
 <div class="card h" style="text-align:center"><h3>Common mess QR</h3>${qrBox()}</div></div></div>`};
V["/checkin"]=async()=>{const[o,ins]=await Promise.all([api.occ(),api.inside(S.email)]);const full=!ins&&o.n>=o.cap;
 return`<div class="page stk" style="max-width:480px;margin:0 auto"><h1>Mess check-in</h1>${occCard(o)}<div class="card"><h3>${ins?"You're currently inside":"You're currently outside"}</h3>
 <p class="mut">${full?"The mess is full. Try again in a few minutes.":ins?"Tap when you've finished eating.":"Tap to let others see you're in."}</p>
 <button class="btn ${ins?"out":"go"}" id="tog" ${full?"disabled":""}>${ins?"EXIT MESS":"ENTER MESS"}</button><div class="err" id="ve" role="alert"></div></div></div>`};
V["/menu"]=async()=>{const m=await api.menu();return`<div class="page stk"><h1>Today's menu</h1><div class="grid">${Object.entries(m).map(([k,v])=>`<div class="card h"><h3>${k}</h3>${v.length?`<ul style="padding-left:1.1rem;margin:0">${v.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`:'<p class="empty">No items yet.</p>'}</div>`).join("")}</div></div>`};
V["/report"]=async()=>`<div class="page"><div class="card" style="max-width:520px;margin:0 auto"><h2>Report a problem</h2><form id="f"><label for="tx">What went wrong?</label><textarea id="tx" placeholder="Food quality, cleanliness, queue…"></textarea><div id="ve" class="err" role="alert"></div><button class="btn" style="margin-top:.6rem">Submit problem</button></form></div></div>`;
V["/admin"]=async()=>{const[o,tx]=await Promise.all([api.occ(),api.tx()]);
 return`<div class="page stk"><div class="row"><h1>Live occupancy</h1><button class="btn out sm" data-reset>Reset mess</button></div>${occCard(o)}
 <div class="card"><h3>Recent activity</h3>${txTable(tx.slice(0,5))}</div></div>`};
const txTable=t=>t.length?`<div class="sc"><table><thead><tr><th>Student</th><th>Action</th><th>Time</th></tr></thead><tbody>${t.map(x=>`<tr><td>${esc(x.who)}</td><td>${x.type==="IN"?"▲ Entered":x.type==="OUT"?"▼ Exited":"⟲ Reset"}</td><td>${fmt(x.at)}</td></tr>`).join("")}</tbody></table></div>`:'<p class="empty">No check-ins yet today.</p>';
V["/admin/tx"]=async()=>`<div class="page stk"><h1>Transactions</h1><div class="card">${txTable(await api.tx())}</div></div>`;
V["/admin/problems"]=async()=>{const p=await api.problems();return`<div class="page stk"><h1>Problems</h1>${p.length?p.map(x=>`<div class="card"><div class="row"><div><strong>${esc(x.who)}</strong> <span class="mut">${fmt(x.at)}</span><p style="margin:.3rem 0 0">${esc(x.text)}</p></div><button class="btn sm ${x.done?"ghost":""}" data-res="${x.id}">${x.done?"✓ Resolved – reopen":"Mark resolved"}</button></div></div>`).join(""):'<div class="card empty">No problems reported. Nice.</div>'}</div>`};
V["/admin/menu"]=async()=>{const m=await api.menu();return`<div class="page stk"><h1>Manage menu</h1><div class="grid">${Object.entries(m).map(([k,v])=>`<div class="card"><h3>${k}</h3><div>${v.map(i=>`<span class="chip">${esc(i)}<button data-rm="${k}|${esc(i)}" aria-label="Remove ${esc(i)}">×</button></span>`).join("")||'<p class="empty">Empty</p>'}</div>
 <form data-add="${k}" class="row" style="margin-top:.8rem;flex-wrap:nowrap"><input aria-label="Add dish to ${k}" placeholder="Add dish"><button class="btn sm">Add</button></form></div>`).join("")}</div><div id="ve" class="err" role="alert"></div></div>`};
V["/admin/settings"]=async()=>{const o=await api.occ();return`<div class="page stk"><h1>Settings</h1><div class="grid"><div class="card"><h3>Mess details</h3><form id="f"><label for="mn">Mess name</label><input id="mn" value="${esc(o.name)}"><label for="cp">Capacity (seats)</label><input id="cp" type="number" min="1" value="${o.cap}"><div id="ve" class="err" role="alert"></div><button class="btn" style="margin-top:.6rem">Save settings</button></form></div>
 <div class="card" style="text-align:center"><h3>Common mess QR</h3>${qrBox()}<p class="mut">Print one copy for the mess board. Students scan it to check in or out.</p></div>
 <div class="card"><h3>Reset occupancy</h3><p class="mut">Use at end of a meal to clear anyone who forgot to exit.</p><button class="btn out" data-reset>Reset mess</button></div></div></div>`};
/* ========= ROUTER ========= */
const guard={student:["/student","/checkin","/menu","/report"],admin:["/admin","/admin/tx","/admin/problems","/admin/menu","/admin/settings"]};
async function route(){const p=(location.hash.slice(1)||"/").split("?")[0];
 if(!V[p]){app.innerHTML='<div class="page card empty"><h2>Page not found</h2><a class="btn" href="#/">Back to portals</a></div>';nav(p);return}
 const need=guard.student.includes(p)?"student":guard.admin.includes(p)?"admin":null;
 if(need&&(!S||S.role!==need)){if(need==="student")try{sessionStorage.setItem("mf_next",p)}catch(e){}return go(need==="student"?"/student/login":"/admin/login")}
 nav(p);app.innerHTML=sk;lastN=lastN;
 try{const h=await V[p]();if(h===undefined)return;app.innerHTML=h;animate();bind(p);window.scrollTo(0,0);app.focus({preventScroll:true})}
 catch(e){app.innerHTML='<div class="page card empty"><h2>Connection problem</h2><p>Connection problem. Please try again.</p><button class="btn" onclick="route()">Retry</button></div>'}}
function bind(p){const f=$("#f"),ve=$("#ve");
 if(f&&p.includes("login"))f.onsubmit=async e=>{e.preventDefault();const role=p.startsWith("/admin")?"admin":"student";let ok=await act(f.querySelector("button"),async()=>save(await api.login(role,$("#em").value.trim(),$("#pw").value)),null,ve);if(ok){let n=null;try{n=sessionStorage.getItem("mf_next");sessionStorage.removeItem("mf_next")}catch(e){}go(role==="admin"?"/admin":n||"/student")}};
 if(f&&p==="/student/register")f.onsubmit=async e=>{e.preventDefault();const d={name:$("#nm").value.trim(),roll:$("#rl").value.trim(),email:$("#em").value.trim(),pass:$("#pw").value};
  if(!d.name||!d.email||d.pass.length<6){ve.textContent="Fill every field. Password needs 6+ characters.";return}
  if(await act(f.querySelector("button"),()=>api.register(d),null,ve)){app.innerHTML=`<div class="page"><div class="card" style="max-width:440px;margin:1rem auto"><h2>Enter verification code</h2><p class="mut">We sent a 6-digit code to ${esc(d.email)}.</p><form id="vf"><label for="vc">Verification code</label><input id="vc" inputmode="numeric" maxlength="6" autocomplete="one-time-code"><div id="ve" class="err" role="alert"></div><button class="btn" style="width:100%;margin-top:.6rem">Verify and continue</button></form></div></div>`;
   $("#vf").onsubmit=async e=>{e.preventDefault();if(await act($("#vf button"),async()=>save(await api.verify(d.email,$("#vc").value.trim())),"Account ready",$("#ve")))setTimeout(()=>go("/student"),900)}}};
 if(p==="/checkin"){const b=$("#tog");b?.addEventListener("click",async()=>{const entering=b.textContent==="ENTER MESS";if(await act(b,()=>entering?api.enter(S):api.exit(S),entering?"Welcome in!":"See you again!",ve))setTimeout(route,1500);else setTimeout(route,1200)})}
 if(p==="/report")f.onsubmit=async e=>{e.preventDefault();if(await act(f.querySelector("button"),()=>api.report(S,$("#tx").value),"Problem sent",ve))f.reset()};
 if(p==="/admin/settings")f.onsubmit=async e=>{e.preventDefault();if(await act(f.querySelector("button"),()=>api.setCap(+$("#cp").value,$("#mn").value.trim()),"Settings saved",ve))setTimeout(route,1500)};
 document.querySelectorAll("[data-res]").forEach(b=>b.onclick=async()=>{await act(b,()=>api.resolve(+b.dataset.res));route()});
 document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{const[m,i]=b.dataset.rm.split("|");b.parentElement.style.transition=".25s";b.parentElement.style.transform="scale(0)";await act(b,()=>api.menuEdit(m,i.replace(/&amp;/g,"&"),false));route()});
 document.querySelectorAll("[data-add]").forEach(fm=>fm.onsubmit=async e=>{e.preventDefault();if(await act(fm.querySelector("button"),()=>api.menuEdit(fm.dataset.add,fm.querySelector("input").value,true),null,ve))route()});
 document.querySelectorAll("[data-reset]").forEach(b=>b.onclick=()=>$("#dlg").showModal())}
$("#dno").onclick=()=>$("#dlg").close();
$("#dyes").onclick=async()=>{const b=$("#dyes");if(await act(b,()=>api.reset(),"Mess reset")){$("#dlg").close();setTimeout(route,1500)}else toast("Unable to reset mess occupancy.")};
addEventListener("hashchange",route);route();
</script>
</body>
</html>
